pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file("local.properties")
        if (localProperties.exists()) {
            localProperties.withInputStream { properties.load(it) }
        }
        def sdk = properties.getProperty("flutter.sdk")
        if (sdk == null || sdk.toString().trim().isEmpty()) {
            sdk = System.getenv("FLUTTER_ROOT")
        }
        if (sdk == null || sdk.toString().trim().isEmpty()) {
            sdk = System.getenv("FLUTTER_HOME")
        }
        assert sdk != null && !sdk.toString().trim().isEmpty() : "flutter.sdk not set in local.properties"
        return sdk.toString().trim()
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
